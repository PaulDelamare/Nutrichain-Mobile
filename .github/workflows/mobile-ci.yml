name: Mobile CI

on:
  push:
    branches: [main]
  # Toutes les branches cibles : le travail s'empile aujourd'hui sur des branches
  # d'intégration, une PR qui ne vise pas `main` doit quand même être validée.
  pull_request:

jobs:
  ci:
    name: Mobile CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci
